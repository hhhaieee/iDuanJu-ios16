name: Build iOS 16 IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    # macos-15-intel: 4 vCPU / 14GB 内存。arm64 标准机只有 7GB，编译 TDLibKit（整包优化）会 OOM 被杀。
    # 注：2026-11-17 曾出现"任何 runner 标签都零日志秒失败"，根因是账号 Actions 分钟配额耗尽，
    # 恢复配额后此标签可正常调度，勿在 $0 支出上限下改用 large/xlarge 机型（未启用会产生计费失败）。
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      # 缓存 DerivedData：TDLibKit 整包编译在内存小的编译机上极易被 OOM 杀掉。
      # restore/save 拆开，save 用 if: always() —— 即使编译失败也能留存已编译产物，
      # 下一轮接着上次进度继续（增量收敛）。
      - name: Restore DerivedData
        uses: actions/cache/restore@v4
        with:
          path: DerivedDataRelease
          key: dd-v1-${{ github.run_id }}
          restore-keys: |
            dd-v1-

      - name: Build unsigned IPA
        run: bash scripts/package.sh dist

      - name: Save DerivedData
        if: always()
        uses: actions/cache/save@v4
        with:
          path: DerivedDataRelease
          key: dd-v1-${{ github.run_id }}

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: STV-ios16-unsigned
          path: |
            dist/*.ipa
            dist/*.sh
          if-no-files-found: error
