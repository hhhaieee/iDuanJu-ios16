name: Build iOS 16 IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    permissions:
      contents: write
    # macos-15-intel: 4 vCPU / 14GB 内存。arm64 标准机只有 7GB，编译 TDLibKit（整包优化）会 OOM 被杀。
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      # 缓存 DerivedData：TDLibKit 整包编译在内存小的编译机上极易被 OOM 杀掉。
      # restore/save 拆开，save 用 if: always() —— 即使编译失败也能留存已编译产物，
      # 下一轮接着上次进度继续（增量收敛）。
      - name: Restore DerivedData
        uses: actions/cache/restore@v4
        with:
          path: DerivedDataRelease
          key: dd-v1-${{ github.run_id }}
          restore-keys: |
            dd-v1-

      - name: Build unsigned IPA
        run: bash scripts/package.sh dist

      - name: Save DerivedData
        if: always()
        uses: actions/cache/save@v4
        with:
          path: DerivedDataRelease
          key: dd-v1-${{ github.run_id }}

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: STV-ios16-unsigned
          path: |
            dist/*.ipa
            dist/*.sh
          if-no-files-found: error

      # runner 内网直接发布到 Release，避免从 Actions artifact 下载 38MB IPA（慢且易超时）。
      # 使用仓库内置的 secrets.GITHUB_TOKEN，不含任何个人 PAT。
      - name: Publish unsigned IPA to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER=$(awk -F'"' '/MARKETING_VERSION/{print $2; exit}' project.yml)
          BUILD=$(awk -F'"' '/CURRENT_PROJECT_VERSION/{print $2; exit}' project.yml)
          TAG="v${VER}-${BUILD}"
          ASSET="HeiGuoYeJu-${VER}-${BUILD}-unsigned.ipa"
          SRC=$(ls dist/*.ipa | head -n 1)
          cp "$SRC" "dist/$ASSET"
          TITLE="HeiGuoYeJu ${VER} (build ${BUILD}) - build76 内置爱看机器人影视插件 + 文件选择只显对应格式"
          NOTES="build76: ① 新增内置插件「爱看机器人」（ikanbot，全网聚合搜索影视源，多线路 m3u8 播放，基于 guoapp 开源模块适配），在插件页「推荐插件」点安装即可用；② 插件沙箱新增 html.toTree（节点树）与同步 HTTP 能力，视频插件支持 allowAnyMedia 声明以播放动态 CDN 线路；③ 文件选择器收窄：插件只显示 .idjplugin、备份只显示 .idjbackup，其他格式置灰；④ 沿用 build75 的原生文件选择器与全部播放器/弹幕优化。"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/$ASSET" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" "dist/$ASSET" --title "$TITLE" \
              --notes "$NOTES"
          fi
