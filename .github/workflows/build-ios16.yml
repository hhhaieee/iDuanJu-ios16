name: Build iOS 16 IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    permissions:
      contents: write
    # macos-15-intel: 4 vCPU / 14GB 内存。arm64 标准机只有 7GB，编译 TDLibKit（整包优化）会 OOM 被杀。
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      # 缓存 DerivedData：TDLibKit 整包编译在内存小的编译机上极易被 OOM 杀掉。
      # restore/save 拆开，save 用 if: always() —— 即使编译失败也能留存已编译产物，
      # 下一轮接着上次进度继续（增量收敛）。
      - name: Restore DerivedData
        uses: actions/cache/restore@v4
        with:
          path: DerivedDataRelease
          key: dd-v1-${{ github.run_id }}
          restore-keys: |
            dd-v1-

      - name: Build unsigned IPA
        run: bash scripts/package.sh dist

      - name: Save DerivedData
        if: always()
        uses: actions/cache/save@v4
        with:
          path: DerivedDataRelease
          key: dd-v1-${{ github.run_id }}

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: STV-ios16-unsigned
          path: |
            dist/*.ipa
            dist/*.sh
          if-no-files-found: error

      # runner 内网直接发布到 Release，避免从 Actions artifact 下载 38MB IPA（慢且易超时）。
      # 使用仓库内置的 secrets.GITHUB_TOKEN，不含任何个人 PAT。
      - name: Publish unsigned IPA to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER=$(awk -F'"' '/MARKETING_VERSION/{print $2; exit}' project.yml)
          BUILD=$(awk -F'"' '/CURRENT_PROJECT_VERSION/{print $2; exit}' project.yml)
          TAG="v${VER}-${BUILD}"
          ASSET="HeiGuoYeJu-${VER}-${BUILD}-unsigned.ipa"
          SRC=$(ls dist/*.ipa | head -n 1)
          cp "$SRC" "dist/$ASSET"
          TITLE="HeiGuoYeJu ${VER} (build ${BUILD}) - build61 回退下载第一版/不支持源标注/弹幕区域与设置修复"
          NOTES="build61: 黄果下载回退到 build54 第一版实现，并对下载后无法播放的黄果短剧在「下载本集」处标注「当前片源不支持下载」(同弹幕的无源提示) · 修显示区域：行数与行距把所选区域真正铺满，3/4 覆盖到可用区 3/4，预览带同步 · 弹幕设置面板加关闭按钮，横屏固定 large detent 随时可关 · 修横屏转竖屏跳第一集：scrollPosition 改单向，换集交给手势落页"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/$ASSET" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" "dist/$ASSET" --title "$TITLE" \
              --notes "$NOTES"
          fi
