name: Build iOS 16 IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    permissions:
      contents: write
    # macos-15-intel: 4 vCPU / 14GB 内存。arm64 标准机只有 7GB，编译 TDLibKit（整包优化）会 OOM 被杀。
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      # 缓存 DerivedData：TDLibKit 整包编译在内存小的编译机上极易被 OOM 杀掉。
      # restore/save 拆开，save 用 if: always() —— 即使编译失败也能留存已编译产物，
      # 下一轮接着上次进度继续（增量收敛）。
      - name: Restore DerivedData
        uses: actions/cache/restore@v4
        with:
          path: DerivedDataRelease
          key: dd-v1-${{ github.run_id }}
          restore-keys: |
            dd-v1-

      - name: Build unsigned IPA
        run: bash scripts/package.sh dist

      - name: Save DerivedData
        if: always()
        uses: actions/cache/save@v4
        with:
          path: DerivedDataRelease
          key: dd-v1-${{ github.run_id }}

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: STV-ios16-unsigned
          path: |
            dist/*.ipa
            dist/*.sh
          if-no-files-found: error

      # runner 内网直接发布到 Release，避免从 Actions artifact 下载 38MB IPA（慢且易超时）。
      # 使用仓库内置的 secrets.GITHUB_TOKEN，不含任何个人 PAT。
      - name: Publish unsigned IPA to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER=$(awk -F'"' '/MARKETING_VERSION/{print $2; exit}' project.yml)
          BUILD=$(awk -F'"' '/CURRENT_PROJECT_VERSION/{print $2; exit}' project.yml)
          TAG="v${VER}-${BUILD}"
          ASSET="HeiGuoYeJu-${VER}-${BUILD}-unsigned.ipa"
          SRC=$(ls dist/*.ipa | head -n 1)
          cp "$SRC" "dist/$ASSET"
          TITLE="HeiGuoYeJu ${VER} (build ${BUILD}) - build87 音量边界提示真正修复 + 全屏连播切集菜单栏不再自动弹出"
          NOTES="build87: ① 真正修复音量到 0%/100% 后继续按同方向实体键不弹指示图——build86 用的旧通知名 AVSystemController_SystemVolumeDidChangeNotification 在 iOS 15+ 已改名为 SystemVolumeDidChange，导致边界通知根本收不到；build87 改为新旧通知双通道监听 + SequenceNumber 去重（一次按键回调两次），边界按键现在正常弹 HUD。② 修复全屏观看自动连播切集时控制栏菜单栏自动唤醒打扰观感——切集时记住切换前的控制栏可见状态，沉浸观看中连播保持隐藏，加载期间也不再强制弹栏；手动切集/首载/主动唤出不受影响。③ 沿用 build85 起全部能力（物理音量键 KVO 提示、手势调音量双通道互不干扰）及 build84 及以下能力（在线仓库/黑果扩展库/默认 raw 源站/帝果插件、红果画质真实分辨率、爱看机器人封面 Referer、插件开关防误触、播放自动换线/降权、商店哈希校验）。"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/$ASSET" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" "dist/$ASSET" --title "$TITLE" \
              --notes "$NOTES"
          fi
