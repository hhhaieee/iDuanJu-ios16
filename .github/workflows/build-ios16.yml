name: Build iOS 16 IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    permissions:
      contents: write
    # macos-15-intel: 4 vCPU / 14GB 内存。arm64 标准机只有 7GB，编译 TDLibKit（整包优化）会 OOM 被杀。
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      # 缓存 DerivedData：TDLibKit 整包编译在内存小的编译机上极易被 OOM 杀掉。
      # restore/save 拆开，save 用 if: always() —— 即使编译失败也能留存已编译产物，
      # 下一轮接着上次进度继续（增量收敛）。
      - name: Restore DerivedData
        uses: actions/cache/restore@v4
        with:
          path: DerivedDataRelease
          key: dd-v1-${{ github.run_id }}
          restore-keys: |
            dd-v1-

      - name: Build unsigned IPA
        run: bash scripts/package.sh dist

      - name: Save DerivedData
        if: always()
        uses: actions/cache/save@v4
        with:
          path: DerivedDataRelease
          key: dd-v1-${{ github.run_id }}

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: STV-ios16-unsigned
          path: |
            dist/*.ipa
            dist/*.sh
          if-no-files-found: error

      # runner 内网直接发布到 Release，避免从 Actions artifact 下载 38MB IPA（慢且易超时）。
      # 使用仓库内置的 secrets.GITHUB_TOKEN，不含任何个人 PAT。
      - name: Publish unsigned IPA to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER=$(awk -F'"' '/MARKETING_VERSION/{print $2; exit}' project.yml)
          BUILD=$(awk -F'"' '/CURRENT_PROJECT_VERSION/{print $2; exit}' project.yml)
          TAG="v${VER}-${BUILD}"
          ASSET="HeiGuoYeJu-${VER}-${BUILD}-unsigned.ipa"
          SRC=$(ls dist/*.ipa | head -n 1)
          cp "$SRC" "dist/$ASSET"
          TITLE="HeiGuoYeJu ${VER} (build ${BUILD}) - build84 在线仓库上架「帝果」+ 商店更名「黑果扩展库」+ 默认地址改 raw 源站"
          NOTES="build84: ① 在线仓库上架新插件「帝果」（com.idj.dsd-custom，成人向短剧站源，来源 ericto888/guoapp-mod-dsd-custom），支持分类/搜索/详情/播放、主备域名切换与播放签名；② 官方在线仓库更名为「黑果扩展库」；③ 默认商店地址由 jsDelivr 版本 tag 改为 raw 源站 main 分支（https://raw.githubusercontent.com/hhhaieee/idj-plugins/main/index.json），插件上架/更新即时生效、彻底摆脱 CDN 缓存延迟，以后插件增删改不再需要重发 App；④ 历史地址（@main、@v1.0.6、@v1.0.7、@v1.0.8）统一自动迁移到新 raw 地址，升级后自动刷新、不重复不丢失；⑤ 沿用 build83 全部能力（红果画质标签真实分辨率、爱看机器人封面 Referer、插件开关防误触、播放自动换线/降权、商店哈希校验）。"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/$ASSET" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" "dist/$ASSET" --title "$TITLE" \
              --notes "$NOTES"
          fi
