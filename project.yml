name: STV
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: "5.0"
  TARGETED_DEVICE_FAMILY: "1,2"
packages:
  TDLibKit:
    url: https://github.com/Swiftgram/TDLibKit
    exactVersion: 1.5.2-tdlib-1.8.69-6126ecae
  QuickJS:
    path: Packages/QuickJS
  AetherEngine:
    path: AetherEngine
targets:
  STV:
    type: application
    platform: iOS
    sources:
      - STV
    dependencies:
      - package: TDLibKit
      - package: QuickJS
        product: CQuickJS
      - package: AetherEngine
        product: AetherEngine
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.local.STV
      GENERATE_INFOPLIST_FILE: YES
      MARKETING_VERSION: "1.5.3"
      CURRENT_PROJECT_VERSION: "53"
      SWIFT_EMIT_LOC_STRINGS: YES
      SWIFT_OBJC_BRIDGING_HEADER: STV/Support/STV-Bridging-Header.h
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: STV/Info.plist
      properties:
        CFBundleDisplayName: 黑果夜剧
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations:
          - zh-Hans
          - en
        NSFaceIDUsageDescription: 用于解锁「片源管理」里隐藏的长视频片源
        NSPhotoLibraryAddUsageDescription: 用于把你下载的图片和视频保存到相册
        LSApplicationQueriesSchemes: [tg]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSAppTransportSecurity:
          # 「阅读」书源: many novel sites are http-only. (NSAllowsLocalNetworking must not be set alongside:
          # iOS then ignores NSAllowsArbitraryLoads. Arbitrary loads already include the local proxy.)
          NSAllowsArbitraryLoads: true
        UILaunchScreen: {}
        # 自定义插件文件类型：没有这个声明，系统文件选择器会把 .idjplugin 置灰（"无法打开的类型"）。
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.stv.idjplugin
            UTTypeDescription: iDuanJu Plugin
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - idjplugin
        CFBundleDocumentTypes:
          - CFBundleTypeName: iDuanJu Plugin
            LSItemContentTypes:
              - com.stv.idjplugin
            LSHandlerRank: Owner
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  STVTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: STVTests
        excludes:
          - "Fixtures/Plugins/**"
    dependencies:
      - target: STV
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.local.STVTests
  STVUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - STVUITests
    dependencies:
      - target: STV
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.local.STVUITests
      TEST_TARGET_NAME: STV
schemes:
  STV:
    build:
      targets:
        STV: all
        STVTests: [test]
        STVUITests: [test]
    test:
      targets:
        - STVTests
        - STVUITests
